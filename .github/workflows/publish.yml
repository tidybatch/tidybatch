name: Publish to PyPI

# Trusted publishing (OIDC): PyPI trusts this workflow, so no token is stored anywhere.
# PyPI side: publisher for project "tidybatch", owner "tidybatch", repository "tidybatch",
# workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests
      # Also on workflow_dispatch: a manual run only publishes from the v<version> tag, never a branch.
      - name: Release tag matches the version
        run: test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = "v$(python -c 'import tidybatch; print(tidybatch.__version__)')"
      - name: Build
        run: python -m pip install build==1.2.2 && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # only this job can prove to PyPI that it is this workflow
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
