name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.9 is what macOS ships as /usr/bin/python3 (Command Line Tools)
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install as a tool and smoke-test
        run: |
          python -m pip install .
          tidybatch --version

  exif:
    # The photo-date parser against ExifTool's own sample images, plus a fuzz run.
    # ExifTool is pinned so a new upstream sample can't turn CI red on its own.
    runs-on: ubuntu-latest
    env:
      EXIFTOOL_COMMIT: 980409314fddbd83d9092b5c160fafab7f67fd52  # 13.60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Fetch ExifTool and its sample images
        run: |
          git init -q "$RUNNER_TEMP/exiftool"
          git -C "$RUNNER_TEMP/exiftool" fetch -q --depth 1 https://github.com/exiftool/exiftool "$EXIFTOOL_COMMIT"
          git -C "$RUNNER_TEMP/exiftool" checkout -q FETCH_HEAD
      - name: Dates match ExifTool
        run: python dev/verify_exif.py "$RUNNER_TEMP/exiftool"
      - name: Corrupted files never crash or hang
        run: python dev/fuzz_exif.py "$RUNNER_TEMP/exiftool" 20000
